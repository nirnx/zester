name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Node/pnpm toolchain for the docs site (gate 2 below). Action versions
      # copied verbatim from docs.yml so the two workflows never drift.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Compile-only check of the Docker-based suite: catches dependency
      # bumps that break the integration tree, since the full integration
      # job is skipped on PRs.
      - name: go vet (integration tag)
        run: go vet -tags integration ./integration/

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: build
        run: go build ./...

      # Keystone spec §9 gate 1: the self-documenting-module artifacts
      # (module MDX pages, guides/modules/meta.json, the combined JSON Schema
      # artifact, pkg/moduledoc/docdata.json) must already match what
      # cmd/zester-docgen generates from the live registries — a PR that
      # changes a module's Doc/Spec without regenerating fails here instead of
      # silently drifting. `git add -A` stages the whole tree so the `--cached`
      # diff sees docgen's rewrites regardless of what else the PR touched;
      # the check itself is scoped to the generated paths only. The index is
      # always left clean afterward (git reset), success or failure, so this
      # step never leaks staged state into later steps.
      - name: docgen freshness (gate 1)
        run: |
          go run ./cmd/zester-docgen
          git add -A
          docgen_diff_status=0
          git diff --cached --exit-code -- website/ pkg/moduledoc || docgen_diff_status=$?
          git reset
          if [ "$docgen_diff_status" -ne 0 ]; then
            echo "::error::generated docs are stale — run 'go run ./cmd/zester-docgen' and commit the result (website/, pkg/moduledoc)."
            exit 1
          fi

      - name: unit tests
        run: go test -count=1 ./...

      - name: race detector (core packages)
        run: go test -race -count=1 ./pkg/job/ ./pkg/schedule/ ./pkg/update/ ./pkg/statefiles/ ./pkg/basket/ ./pkg/facts/

      # Keystone spec §9 gate 2: the docs site must actually build on every
      # PR, not just at deploy time (docs.yml only runs on pushes to main).
      - name: website install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: website build (gate 2)
        working-directory: website
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    # Docker-based end-to-end suite; heavier, so only on main pushes.
    if: github.event_name == 'push'
    # The zz_ca_rotation test alone rolls the 3-node NATS cluster twice with
    # full-fleet recovery waits; 15m was routinely within noise of a green run.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: integration tests
        run: go test -v -tags integration -count=1 -timeout 25m ./integration/
