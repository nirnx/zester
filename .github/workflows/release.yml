name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs full history + tags for version stamping
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Build .deb packages (linux/amd64)
        env:
          # nfpm@latest may require a newer toolchain than go.mod pins;
          # auto lets `go install` fetch it (module builds stay on go.mod's).
          GOTOOLCHAIN: auto
        run: make deb-all GOARCH=amd64

      - name: Tarball raw binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C bin/release -czf "dist/zester-${version}-linux-amd64.tar.gz" \
            zester zester-master zester-peel zester-watchdog zester-migrate

      - name: Checksums
        working-directory: dist
        run: sha256sum *.deb *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_args=()
          # Use the matching CHANGELOG section as release notes when present.
          if [ -f CHANGELOG.md ]; then
            version="${GITHUB_REF_NAME#v}"
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > /tmp/notes.md
            [ -s /tmp/notes.md ] && notes_args=(--notes-file /tmp/notes.md)
          fi
          [ ${#notes_args[@]} -eq 0 ] && notes_args=(--generate-notes)
          # Idempotent: re-running a tag refreshes assets instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/*.deb dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Zester $GITHUB_REF_NAME" \
              "${notes_args[@]}" \
              dist/*.deb dist/*.tar.gz dist/SHA256SUMS
          fi

      # ---- APT repository (https://repo.zester.cc) ------------------------
      # Upload each .deb to the self-hosted repo server; it signs and rebuilds
      # the noble/main index on ingest. The server holds its own signing key —
      # no GPG material is needed in CI. Auth via the REPO_PUBLISH_TOKEN secret.
      - name: Publish to APT repository
        env:
          REPO_PUBLISH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
          # Override in the workflow if the server's suite/component ever change.
          APT_DIST: noble
          APT_COMPONENT: main
        run: |
          set -euo pipefail
          if [ -z "${REPO_PUBLISH_TOKEN:-}" ]; then
            echo "::error::REPO_PUBLISH_TOKEN secret is not set — cannot publish to repo.zester.cc" >&2
            exit 1
          fi
          upload="https://repo.zester.cc/debian/pool/${APT_DIST}/${APT_COMPONENT}/upload"
          count=0
          for deb in dist/*.deb; do
            echo "uploading $(basename "$deb") -> ${APT_DIST}/${APT_COMPONENT}"
            curl -fsS --retry 3 --retry-delay 2 \
              --user "zester:${REPO_PUBLISH_TOKEN}" \
              --upload-file "$deb" "$upload"
            count=$((count + 1))
          done
          echo "published $count package(s) to repo.zester.cc"
