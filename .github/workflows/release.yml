name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs full history + tags for version stamping
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Build .deb packages (linux/amd64)
        env:
          # nfpm@latest may require a newer toolchain than go.mod pins;
          # auto lets `go install` fetch it (module builds stay on go.mod's).
          GOTOOLCHAIN: auto
        run: make deb-all GOARCH=amd64

      - name: Tarball raw binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C bin/release -czf "dist/zester-${version}-linux-amd64.tar.gz" \
            zester zester-master zester-peel zester-watchdog zester-migrate

      - name: Checksums
        working-directory: dist
        run: sha256sum *.deb *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_args=()
          # Use the matching CHANGELOG section as release notes when present.
          if [ -f CHANGELOG.md ]; then
            version="${GITHUB_REF_NAME#v}"
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > /tmp/notes.md
            [ -s /tmp/notes.md ] && notes_args=(--notes-file /tmp/notes.md)
          fi
          [ ${#notes_args[@]} -eq 0 ] && notes_args=(--generate-notes)
          gh release create "$GITHUB_REF_NAME" \
            --title "Zester $GITHUB_REF_NAME" \
            "${notes_args[@]}" \
            dist/*.deb dist/*.tar.gz dist/SHA256SUMS

      # ---- APT repository (https://zester.cc/repo) -------------------------
      # Publish the .deb packages to the signed APT repo. The `apt-repo` branch
      # is the durable pool of record; the Pages job (below) overlays it into
      # the docs site. See packaging/apt/README.md.
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set — cannot sign the APT repo (see packaging/apt/README.md)" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils gnupg
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')
          echo "GPG_KEY_ID=$keyid" >> "$GITHUB_ENV"

      - name: Publish to apt-repo branch
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Fetch the pool-of-record branch, or bootstrap it as an orphan.
          if git ls-remote --exit-code --heads "$repo_url" apt-repo >/dev/null 2>&1; then
            git clone --branch apt-repo --depth 1 "$repo_url" aptrepo
          else
            git clone --depth 1 "$repo_url" aptrepo
            git -C aptrepo checkout --orphan apt-repo
            git -C aptrepo rm -rfq . || true
          fi
          GPG_KEY_ID="$GPG_KEY_ID" GPG_PASSPHRASE="${GPG_PASSPHRASE:-}" \
            bash packaging/apt/publish-repo.sh "$PWD/aptrepo" "$PWD/dist"
          cp packaging/apt/branch-README.md aptrepo/README.md
          cd aptrepo
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "apt: publish ${GITHUB_REF_NAME}" \
            || { echo "apt-repo unchanged — nothing to publish"; exit 0; }
          git push origin apt-repo

  # Rebuild the Pages site (docs + /repo overlay) so the new packages go live
  # immediately. Reuses the Pages workflow via workflow_call — no cross-workflow
  # trigger needed (a GITHUB_TOKEN push to apt-repo would not start a new run).
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
