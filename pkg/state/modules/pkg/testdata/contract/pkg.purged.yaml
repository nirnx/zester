module: pkg.purged
# Permanent differential contract for the pkg.purged migration (all-primitives
# pkg-family wave). These cases were approved by the legacy-vs-new equivalence
# comparison while the legacy constructor still existed; after its deletion
# RunContract replays them as the permanent regression guard. Accepting cases pin
# the decoded Package projection; rejecting cases pin the error kind. BD-tagged
# cases pin the flagged behavioral difference (§11 BD-6): a non-string name is
# now coerced (scalar) or rejected (composite) instead of legacy's silent
# fallback to the state ID.
cases:
  # --- parity: explicit string name across all three universes ---
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: apache2
    want:
      Package: apache2
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: apache2
    want:
      Package: apache2
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: apache2
    want:
      Package: apache2

  # --- parity: no name key -> primary falls back to the state ID ---
  - label: primary-fallback-yaml
    universe: yaml
    id: apache2
    input: {}
    want:
      Package: apache2
  - label: primary-fallback-cli
    universe: cli
    id: apache2
    input: {}
    want:
      Package: apache2

  # --- parity: an EMPTY-STRING name falls back to the state ID (§2.1 amendment
  # — NOT a BD divergence) ---
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: apache2
    input:
      name: ""
    want:
      Package: apache2
  - label: empty-name-falls-back-to-id-msgpack
    universe: msgpack
    id: apache2
    input:
      name: ""
    want:
      Package: apache2

  # --- parity: a NIL name (YAML null / trailing-colon) falls back to the state
  # ID (§2.1 amendment — NOT a BD divergence) ---
  - label: nil-name-falls-back-to-id-yaml
    universe: yaml
    id: apache2
    input:
      name:
    want:
      Package: apache2

  # --- parity: an ignored reserved/unknown key does not break the decode ---
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: web
    input:
      name: apache2
      require_in:
        - pkg.installed:nginx
    want:
      Package: apache2

  # --- BD-6: numeric name is coerced to its string form (was fallback-to-id) ---
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Package: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Package: "123"
  # CLI already delivers "123" as a string, so this agrees with legacy; it pins
  # the CLI behavior alongside the divergent YAML/msgpack legs.
  - label: numeric-name-cli
    universe: cli
    id: web
    input:
      name: 123
    want:
      Package: "123"

  # --- BD-6: composite name is rejected with a typed error (was fallback-to-id) ---
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
