module: pkg.installed
# Permanent differential contract for the pkg.installed migration (all-primitives
# pkg-family wave). These cases were approved by the legacy-vs-new equivalence
# comparison while the legacy constructor still existed; after its deletion
# RunContract replays them as the permanent regression guard. Accepting cases pin
# the decoded Package/Version/Refresh projection; rejecting cases pin the error
# kind. BD-tagged cases pin the flagged behavioral differences (§11): BD-6 (a
# non-string name/version is now coerced, or rejected for composites, instead of
# silently falling back to the state ID / empty string), BD-2 (a CLI refresh
# truthy/falsy string is now honored instead of being silently ignored), and
# BD-7 (an integer refresh — a plain bool, not TriState; scope amended
# 2026-07-12 to cover every boolean-typed parameter under the maintainer's
# TriState 1/0 approval — is now coerced explicitly: 1/0 to true/false, any
# other integer a typed error, instead of being silently ignored).
cases:
  # --- parity: explicit string name/version/refresh across all three universes ---
  - label: full-config-yaml
    universe: yaml
    id: web
    input:
      name: nginx
      version: "1.24.0-1"
      refresh: false
    want:
      Package: nginx
      Version: "1.24.0-1"
      Refresh: false
  - label: full-config-msgpack
    universe: msgpack
    id: web
    input:
      name: nginx
      version: "1.24.0-1"
      refresh: false
    want:
      Package: nginx
      Version: "1.24.0-1"
      Refresh: false
  - label: full-config-cli
    universe: cli
    id: web
    input:
      name: nginx
      version: "1.24.0-1"
      refresh: false
    want:
      Package: nginx
      Version: "1.24.0-1"
      Refresh: false

  # --- parity: no name key -> primary falls back to the state ID ---
  - label: primary-fallback-yaml
    universe: yaml
    id: nginx
    input: {}
    want:
      Package: nginx
      Version: ""
      Refresh: false
  - label: primary-fallback-cli
    universe: cli
    id: nginx
    input: {}
    want:
      Package: nginx

  # --- parity: an EMPTY-STRING name falls back to the state ID (§2.1 amendment,
  # matching the legacy `if x == "" { x = id }` idiom — NOT a BD divergence) ---
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: nginx
    input:
      name: ""
    want:
      Package: nginx
  - label: empty-name-falls-back-to-id-msgpack
    universe: msgpack
    id: nginx
    input:
      name: ""
    want:
      Package: nginx

  # --- parity: a NIL name (YAML null / trailing-colon) is absent for the param
  # and falls back to the state ID (§2.1 amendment — NOT a BD divergence) ---
  - label: nil-name-falls-back-to-id-yaml
    universe: yaml
    id: nginx
    input:
      name:
    want:
      Package: nginx

  # --- parity: an undeclared version never compares/churns; absent version
  # decodes to the empty string exactly like the legacy comma-ok assertion ---
  - label: no-version-yaml
    universe: yaml
    id: nginx
    input:
      name: nginx
    want:
      Version: ""

  # --- parity: an ignored reserved/unknown key does not break the decode ---
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: web
    input:
      name: nginx
      require:
        - cmd.run:stop
    want:
      Package: nginx

  # --- BD-6: numeric name is coerced to its string form (was fallback-to-id) ---
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Package: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Package: "123"
  # CLI already delivers "123" as a string, so this agrees with legacy; it pins
  # the CLI behavior alongside the divergent YAML/msgpack legs.
  - label: numeric-name-cli
    universe: cli
    id: web
    input:
      name: 123
    want:
      Package: "123"

  # --- BD-6: composite name is rejected with a typed error (was fallback-to-id) ---
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type

  # --- BD-6: numeric version is coerced to its string form (was silently "") ---
  - label: numeric-version-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: nginx
      version: 124
    want:
      Version: "124"
  - label: numeric-version-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: nginx
      version: 124
    want:
      Version: "124"
  # CLI already delivers "124" as a string, so this agrees with legacy.
  - label: numeric-version-cli
    universe: cli
    id: web
    input:
      name: nginx
      version: 124
    want:
      Version: "124"

  # --- BD-6: composite version is rejected with a typed error (was silently "") ---
  - label: composite-version-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: nginx
      version:
        - a
        - b
    want_error: wrong_type
  - label: composite-version-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: nginx
      version:
        - a
        - b
    want_error: wrong_type

  # --- BD-2: a CLI refresh truthy string is now honored (was silently ignored:
  # the legacy config["refresh"].(bool) assertion always fails against a CLI
  # string, so Refresh stayed false regardless of operator intent) ---
  - label: cli-refresh-true-honored
    universe: cli
    id: web
    bd: BD-2
    input:
      name: nginx
      refresh: true
    want:
      Refresh: true
  - label: cli-refresh-truthy-string-honored
    universe: cli
    id: web
    bd: BD-2
    input:
      name: nginx
      refresh: "yes"
    want:
      Refresh: true
  - label: cli-refresh-false-honored
    universe: cli
    id: web
    bd: BD-2
    input:
      name: nginx
      refresh: "0"
    want:
      Refresh: false

  # --- parity: a native YAML/msgpack bool refresh always worked, before and
  # after the migration ---
  - label: refresh-true-yaml
    universe: yaml
    id: web
    input:
      name: nginx
      refresh: true
    want:
      Refresh: true
  - label: refresh-true-msgpack
    universe: msgpack
    id: web
    input:
      name: nginx
      refresh: true
    want:
      Refresh: true

  # --- BD-7 (scope amended 2026-07-12 to cover every boolean-typed
  # parameter, not only TriState): an integer refresh is coerced narrowly —
  # 1 is true and 0 is false (across every int kind; the msgpack leg here
  # decodes to a sized int8). Any OTHER integer is a typed value_invalid
  # error, pinned by refresh-invalid-int-rejected below. Legacy's
  # config["refresh"].(bool) assertion always failed against a bare int, so
  # refresh silently stayed at its false zero value regardless of operator
  # intent. The CLI leg is already covered by the cli-refresh-* BD-2 cases
  # above (the CLI never delivers a raw int — parseKeyValues hands the
  # decoder a string). ---
  - label: refresh-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: nginx
      refresh: 1
    want:
      Refresh: true
  - label: refresh-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: nginx
      refresh: 1
    want:
      Refresh: true
  - label: refresh-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: nginx
      refresh: 0
    want:
      Refresh: false
  - label: refresh-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: nginx
      refresh: 0
    want:
      Refresh: false
  - label: refresh-invalid-int-rejected-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: nginx
      refresh: 2
    want_error: value_invalid
  - label: refresh-invalid-int-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: nginx
      refresh: 2
    want_error: value_invalid
