module: pip.installed
# Permanent differential contract for the pip.installed migration. `name` is
# the primary (defaulting to the state ID); `version`/`requirements` are plain
# strings; `bin` carries an eager `default=pip3`. These cases were approved by
# the legacy-vs-new equivalence comparison while the legacy constructor still
# existed (see the migration changelog); after its deletion RunContract
# replays them as the permanent regression guard. Accept cases pin the decoded
# exported-field projection; reject cases pin the error kind.
#   BD-6 — a wrong-typed name/version/requirements/bin is coerced (scalar) or
#          rejected (composite) instead of silently falling back / to zero;
#   §2.1/§3 empty-string (PARITY, not a BD) — an empty-string name falls back
#          to the state ID; an empty-string bin falls back to the pip3
#          default.
cases:
  # ============================ name (primary) ============================
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: requests
    want:
      Package: requests
      Bin: pip3
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: requests
    want:
      Package: requests
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: requests
    want:
      Package: requests
  - label: primary-fallback-yaml
    universe: yaml
    id: requests
    input: {}
    want:
      Package: requests
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: requests
    input:
      name: ""
    want:
      Package: requests
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: requests
    input:
      name:
    want:
      Package: requests
  # BD-6: a numeric name is coerced to its string form (was fallback-to-id).
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Package: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Package: "123"
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type

  # ============================== version ==============================
  - label: version-string-yaml
    universe: yaml
    id: requests
    input:
      version: "2.28.0"
    want:
      Version: "2.28.0"
  - label: version-absent-yaml
    universe: yaml
    id: requests
    input: {}
    want:
      Version: ""
  # BD-6: a numeric version is coerced to its string form (was dropped to "").
  - label: version-numeric-coerced-yaml
    universe: yaml
    id: requests
    bd: BD-6
    input:
      version: 228
    want:
      Version: "228"
  - label: version-numeric-coerced-msgpack
    universe: msgpack
    id: requests
    bd: BD-6
    input:
      version: 228
    want:
      Version: "228"
  - label: version-composite-rejected-yaml
    universe: yaml
    id: requests
    bd: BD-6
    input:
      version:
        - a
        - b
    want_error: wrong_type
  - label: version-composite-rejected-msgpack
    universe: msgpack
    id: requests
    bd: BD-6
    input:
      version:
        - a
        - b
    want_error: wrong_type

  # ============================ requirements ============================
  - label: requirements-string-yaml
    universe: yaml
    id: myapp
    input:
      requirements: /opt/myapp/requirements.txt
    want:
      Requirements: /opt/myapp/requirements.txt
  # BD-6: a numeric requirements is coerced to its string form (was dropped to "").
  - label: requirements-numeric-coerced-yaml
    universe: yaml
    id: myapp
    bd: BD-6
    input:
      requirements: 123
    want:
      Requirements: "123"
  - label: requirements-numeric-coerced-msgpack
    universe: msgpack
    id: myapp
    bd: BD-6
    input:
      requirements: 123
    want:
      Requirements: "123"
  - label: requirements-composite-rejected-yaml
    universe: yaml
    id: myapp
    bd: BD-6
    input:
      requirements:
        - a
        - b
    want_error: wrong_type
  - label: requirements-composite-rejected-msgpack
    universe: msgpack
    id: myapp
    bd: BD-6
    input:
      requirements:
        - a
        - b
    want_error: wrong_type

  # ========================= bin (eager default=pip3) =========================
  - label: bin-explicit-yaml
    universe: yaml
    id: requests
    input:
      bin: /opt/venv/bin/pip
    want:
      Bin: /opt/venv/bin/pip
  - label: bin-default-yaml
    universe: yaml
    id: requests
    input: {}
    want:
      Bin: pip3
  # PARITY (§2.1/§3 empty-string, not a BD): an empty-string bin falls THROUGH
  # like absence to the pip3 default (bin has no alias), exactly as the legacy
  # `config["bin"].(string)` comma-ok, then empty-check, left it.
  - label: bin-empty-string-defaults-yaml
    universe: yaml
    id: requests
    input:
      bin: ""
    want:
      Bin: pip3
  - label: bin-empty-string-defaults-msgpack
    universe: msgpack
    id: requests
    input:
      bin: ""
    want:
      Bin: pip3
  - label: bin-empty-string-defaults-cli
    universe: cli
    id: requests
    input:
      bin: ""
    want:
      Bin: pip3
  # BD-6: a numeric bin is coerced to its string form (was dropped to the
  # pip3 default).
  - label: bin-numeric-coerced-yaml
    universe: yaml
    id: requests
    bd: BD-6
    input:
      bin: 3
    want:
      Bin: "3"
  - label: bin-numeric-coerced-msgpack
    universe: msgpack
    id: requests
    bd: BD-6
    input:
      bin: 3
    want:
      Bin: "3"
  - label: bin-composite-rejected-yaml
    universe: yaml
    id: requests
    bd: BD-6
    input:
      bin:
        - a
        - b
    want_error: wrong_type
  - label: bin-composite-rejected-msgpack
    universe: msgpack
    id: requests
    bd: BD-6
    input:
      bin:
        - a
        - b
    want_error: wrong_type

  # ============================== misc ==============================
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: requests
    input:
      require:
        - pkg.installed:python3-pip
    want:
      Package: requests
      Bin: pip3
