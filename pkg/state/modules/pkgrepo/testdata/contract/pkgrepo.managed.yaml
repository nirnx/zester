module: pkgrepo.managed
# Permanent differential contract for the pkgrepo.managed migration (a
# parameter-decode-ONLY migration: Check/Apply/Revert and the deferred in-place
# key-rotation detection are unchanged). `name` is the primary (defaulting to the
# state ID); `humanname` is a lazy DERIVED default assigned by the builder tail
# (defaults to the repo name); `baseurl`/`ppa`/`file`/`key_url` are plain strings;
# `enabled`/`gpgcheck`/`refresh` are eager `default=true` bools. These cases were
# approved by the legacy-vs-new equivalence comparison while the legacy
# constructor still existed (see the migration changelog); after its deletion
# RunContract replays them as the permanent regression guard. The decode wrapper
# runs deriveHumanName so the contract can project the DERIVED HumanName facet
# exactly as the builder computes it (mirroring user.present's resolveGroupFacets).
# Accept cases pin the decoded exported-field projection; reject cases pin the
# error kind. BD-tagged cases pin the flagged behavioral differences, per the §11
# per-PARAM pinning standard (every string and bool param gets its own arms):
#   BD-2 (APPROVED) — an ORIGIN-INDEPENDENT string coercion (a truthy/falsy string
#                     enabled/gpgcheck/refresh in EITHER the CLI or a YAML-quoted
#                     value) is honored (was silently dropped to the default true);
#   BD-6 (APPROVED) — a numeric name/humanname/baseurl/ppa/file/key_url is coerced
#                     to its string form (name was a silent fallback to the state
#                     ID; the rest a silent drop), and a composite value for any of
#                     them is rejected with a typed error;
#   BD-7 (APPROVED) — an integer enabled/gpgcheck/refresh is 1=true / 0=false, any
#                     other integer a typed error (was silently dropped);
#   §2.1/§3 empty (PARITY, not a BD) — an empty/nil `name` falls back to the state
#                     ID; an empty `humanname` derives from the name; an empty
#                     enabled/gpgcheck/refresh eager-defaults to true.
cases:
  # ============================ name (primary) ============================
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: docker
    want:
      RepoName: docker
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: docker
    want:
      RepoName: docker
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: docker
    want:
      RepoName: docker
  # Parity: no name key -> primary falls back to the state ID (and humanname
  # derives from it).
  - label: primary-fallback-yaml
    universe: yaml
    id: docker
    input: {}
    want:
      RepoName: docker
      HumanName: docker
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: docker
    input:
      name: ""
    want:
      RepoName: docker
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: docker
    input:
      name:
    want:
      RepoName: docker
  # BD-6: a numeric name is coerced to its string form (was fallback-to-id).
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      RepoName: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      RepoName: "123"
  - label: numeric-name-cli
    universe: cli
    id: web
    input:
      name: 123
    want:
      RepoName: "123"
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type

  # ==================== humanname (lazy DERIVED default) ====================
  # An explicit humanname decodes unchanged.
  - label: humanname-explicit-yaml
    universe: yaml
    id: web
    input:
      name: docker
      humanname: Docker CE
    want:
      HumanName: Docker CE
  # Parity: an absent humanname derives from the repo name (the lazy default the
  # builder tail applies).
  - label: humanname-derives-from-name-yaml
    universe: yaml
    id: web
    input:
      name: myrepo
    want:
      RepoName: myrepo
      HumanName: myrepo
  - label: humanname-derives-from-name-msgpack
    universe: msgpack
    id: web
    input:
      name: myrepo
    want:
      HumanName: myrepo
  # Parity: an empty-string humanname falls through and derives from the name too.
  - label: humanname-empty-derives-yaml
    universe: yaml
    id: web
    input:
      name: myrepo
      humanname: ""
    want:
      HumanName: myrepo
  # BD-6: a numeric humanname is coerced to its string form (non-empty, so the
  # derived default does NOT overwrite it).
  - label: humanname-numeric-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      humanname: 123
    want:
      HumanName: "123"
  - label: humanname-numeric-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: docker
      humanname: 123
    want:
      HumanName: "123"
  - label: humanname-composite-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      humanname:
        - a
        - b
    want_error: wrong_type

  # ============================= baseurl (string) =============================
  - label: baseurl-string-yaml
    universe: yaml
    id: web
    input:
      name: docker
      baseurl: deb https://example.com stable main
    want:
      BaseURL: deb https://example.com stable main
  - label: baseurl-numeric-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      baseurl: 123
    want:
      BaseURL: "123"
  - label: baseurl-numeric-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: docker
      baseurl: 123
    want:
      BaseURL: "123"
  - label: baseurl-composite-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      baseurl:
        - a
        - b
    want_error: wrong_type

  # =============================== ppa (string) ===============================
  - label: ppa-string-yaml
    universe: yaml
    id: web
    input:
      name: nginx
      ppa: ppa:nginx/stable
    want:
      PPA: ppa:nginx/stable
  - label: ppa-numeric-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      ppa: 123
    want:
      PPA: "123"
  - label: ppa-numeric-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: docker
      ppa: 123
    want:
      PPA: "123"
  - label: ppa-composite-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      ppa:
        - a
        - b
    want_error: wrong_type

  # =============================== file (string) ===============================
  - label: file-string-yaml
    universe: yaml
    id: web
    input:
      name: docker
      file: /etc/apt/sources.list.d/custom.list
    want:
      File: /etc/apt/sources.list.d/custom.list
  - label: file-numeric-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      file: 123
    want:
      File: "123"
  - label: file-numeric-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: docker
      file: 123
    want:
      File: "123"
  - label: file-composite-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      file:
        - a
        - b
    want_error: wrong_type

  # ============================= key_url (string) =============================
  - label: key-url-string-yaml
    universe: yaml
    id: web
    input:
      name: docker
      key_url: https://example.com/gpg
    want:
      KeyURL: https://example.com/gpg
  - label: key-url-numeric-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      key_url: 123
    want:
      KeyURL: "123"
  - label: key-url-numeric-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: docker
      key_url: 123
    want:
      KeyURL: "123"
  - label: key-url-composite-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: docker
      key_url:
        - a
        - b
    want_error: wrong_type

  # ======================== enabled (eager default=true) ========================
  - label: enabled-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
      enabled: true
    want:
      Enabled: true
  - label: enabled-false-yaml
    universe: yaml
    id: web
    input:
      name: docker
      enabled: false
    want:
      Enabled: false
  # Parity: an absent enabled eager-defaults to true.
  - label: enabled-default-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
    want:
      Enabled: true
  # Parity: an empty-string enabled falls through to the eager default true.
  - label: enabled-empty-defaults-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
      enabled: ""
    want:
      Enabled: true
  # BD-2: a CLI enabled=false (the string "false") is honored (was dropped to the
  # default true).
  - label: enabled-falsy-string-cli
    universe: cli
    id: web
    bd: BD-2
    input:
      name: docker
      enabled: false
    want:
      Enabled: false
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted "no" is honored too.
  - label: enabled-falsy-string-yaml
    universe: yaml
    id: web
    bd: BD-2
    input:
      name: docker
      enabled: "no"
    want:
      Enabled: false
  # BD-7: an integer enabled is 1=true / 0=false across every int kind.
  - label: enabled-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      enabled: 1
    want:
      Enabled: true
  - label: enabled-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      enabled: 1
    want:
      Enabled: true
  - label: enabled-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      enabled: 0
    want:
      Enabled: false
  - label: enabled-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      enabled: 0
    want:
      Enabled: false
  - label: enabled-invalid-int-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      enabled: 2
    want_error: value_invalid
  - label: enabled-invalid-int-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      enabled: 2
    want_error: value_invalid

  # ======================= gpgcheck (eager default=true) =======================
  # gpgcheck is the same eager-default=true bool as enabled, pinned per-param.
  - label: gpgcheck-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
      gpgcheck: true
    want:
      GPGCheck: true
  - label: gpgcheck-false-yaml
    universe: yaml
    id: web
    input:
      name: docker
      gpgcheck: false
    want:
      GPGCheck: false
  - label: gpgcheck-default-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
    want:
      GPGCheck: true
  - label: gpgcheck-empty-defaults-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
      gpgcheck: ""
    want:
      GPGCheck: true
  - label: gpgcheck-falsy-string-cli
    universe: cli
    id: web
    bd: BD-2
    input:
      name: docker
      gpgcheck: false
    want:
      GPGCheck: false
  - label: gpgcheck-falsy-string-yaml
    universe: yaml
    id: web
    bd: BD-2
    input:
      name: docker
      gpgcheck: "no"
    want:
      GPGCheck: false
  - label: gpgcheck-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      gpgcheck: 1
    want:
      GPGCheck: true
  - label: gpgcheck-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      gpgcheck: 1
    want:
      GPGCheck: true
  - label: gpgcheck-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      gpgcheck: 0
    want:
      GPGCheck: false
  - label: gpgcheck-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      gpgcheck: 0
    want:
      GPGCheck: false
  - label: gpgcheck-invalid-int-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      gpgcheck: 2
    want_error: value_invalid
  - label: gpgcheck-invalid-int-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      gpgcheck: 2
    want_error: value_invalid

  # ======================== refresh (eager default=true) ========================
  # refresh is the same eager-default=true bool as enabled/gpgcheck, pinned per-param.
  - label: refresh-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
      refresh: true
    want:
      Refresh: true
  - label: refresh-false-yaml
    universe: yaml
    id: web
    input:
      name: docker
      refresh: false
    want:
      Refresh: false
  - label: refresh-default-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
    want:
      Refresh: true
  - label: refresh-empty-defaults-true-yaml
    universe: yaml
    id: web
    input:
      name: docker
      refresh: ""
    want:
      Refresh: true
  - label: refresh-falsy-string-cli
    universe: cli
    id: web
    bd: BD-2
    input:
      name: docker
      refresh: false
    want:
      Refresh: false
  - label: refresh-falsy-string-yaml
    universe: yaml
    id: web
    bd: BD-2
    input:
      name: docker
      refresh: "no"
    want:
      Refresh: false
  - label: refresh-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      refresh: 1
    want:
      Refresh: true
  - label: refresh-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      refresh: 1
    want:
      Refresh: true
  - label: refresh-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      refresh: 0
    want:
      Refresh: false
  - label: refresh-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      refresh: 0
    want:
      Refresh: false
  - label: refresh-invalid-int-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: docker
      refresh: 2
    want_error: value_invalid
  - label: refresh-invalid-int-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: docker
      refresh: 2
    want_error: value_invalid

  # ================================= misc =================================
  # A reserved requisite key does not break the decode (it is not a parameter).
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: web
    input:
      name: docker
      baseurl: deb https://example.com stable main
      require:
        - pkg.installed:curl
    want:
      BaseURL: deb https://example.com stable main
