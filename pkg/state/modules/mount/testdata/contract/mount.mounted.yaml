module: mount.mounted
# Permanent differential contract for the mount.mounted migration (a
# parameter-decode-ONLY migration: Check/Apply/Revert and the deferred live-facet
# policy are unchanged). `name` is the primary (defaulting to the state ID),
# `device` is `required`, `fstype`/`opts` carry EAGER `default=ext4`/
# `default=defaults`, `dump`/`pass` are plain ints, and `persist` is an eager
# `default=true` bool. These cases were approved by the legacy-vs-new equivalence
# comparison while the legacy constructor still existed (see the migration
# changelog); after its deletion RunContract replays them as the permanent
# regression guard. Accept cases pin the decoded exported-field projection; reject
# cases pin the error kind. BD-tagged cases pin the flagged behavioral differences,
# per the §11 per-PARAM pinning standard (every string, int, and bool param gets
# its own arms):
#   BD-1 — a msgpack-delivered sized-int dump/pass is honored (the legacy
#          config[...].(int) assertion never matched a uint8/uint16, leaving 0);
#   BD-2 — an ORIGIN-INDEPENDENT string coercion (a numeric-string dump/pass, or a
#          truthy-string persist, in EITHER the CLI or a YAML-quoted value) is
#          honored (was silently dropped);
#   BD-6 — a wrong-typed value is coerced (a numeric name/device/fstype/opts to its
#          string form; a finite-integral FLOAT dump/pass to the integer) or
#          rejected (a composite name/device/fstype/opts/dump/pass) instead of
#          silently falling back / to a zero;
#   BD-7 — an integer persist is 1=true / 0=false, any other integer a typed error
#          (was silently dropped);
#   §2.1/§3 empty-string (PARITY, not a BD) — an empty-string name falls back to
#          the state ID; an empty-string device is missing_required; an empty
#          fstype/opts/persist eager-defaults; an empty dump/pass falls through to
#          the 0 zero value.
cases:
  # ============================ name (primary) ============================
  - label: string-name-yaml
    universe: yaml
    id: mp
    input:
      name: /mnt/data
      device: /dev/sdb1
    want:
      MountPoint: /mnt/data
      Device: /dev/sdb1
  - label: string-name-msgpack
    universe: msgpack
    id: mp
    input:
      name: /mnt/data
      device: /dev/sdb1
    want:
      MountPoint: /mnt/data
  - label: string-name-cli
    universe: cli
    id: mp
    input:
      name: /mnt/data
      device: /dev/sdb1
    want:
      MountPoint: /mnt/data
  - label: primary-fallback-yaml
    universe: yaml
    id: /mnt/data
    input:
      device: /dev/sdb1
    want:
      MountPoint: /mnt/data
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: /mnt/data
    input:
      name: ""
      device: /dev/sdb1
    want:
      MountPoint: /mnt/data
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: /mnt/data
    input:
      name:
      device: /dev/sdb1
    want:
      MountPoint: /mnt/data
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      name: 123
      device: /dev/sdb1
    want:
      MountPoint: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: mp
    bd: BD-6
    input:
      name: 123
      device: /dev/sdb1
    want:
      MountPoint: "123"
  - label: numeric-name-cli
    universe: cli
    id: mp
    input:
      name: 123
      device: /dev/sdb1
    want:
      MountPoint: "123"
  - label: composite-name-rejected-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      name:
        - a
        - b
      device: /dev/sdb1
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: mp
    bd: BD-6
    input:
      name:
        - a
        - b
      device: /dev/sdb1
    want_error: wrong_type

  # ============================ device (required) ============================
  - label: device-string-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
    want:
      Device: /dev/sdb1
  - label: device-missing-rejected-yaml
    universe: yaml
    id: mp
    input: {}
    want_error: missing_required
  - label: device-empty-rejected-yaml
    universe: yaml
    id: mp
    input:
      device: ""
    want_error: missing_required
  - label: device-missing-rejected-msgpack
    universe: msgpack
    id: mp
    input: {}
    want_error: missing_required
  # BD-6 (ERROR->ACCEPT flip on a REQUIRED param): a numeric device is coerced to
  # its string form and ACCEPTED, where legacy config["device"].(string) missed the
  # non-string and hard-errored 'device is required'.
  - label: device-numeric-accepted-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: 123
    want:
      Device: "123"
  - label: device-numeric-accepted-msgpack
    universe: msgpack
    id: mp
    bd: BD-6
    input:
      device: 123
    want:
      Device: "123"
  - label: device-composite-rejected-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device:
        - a
        - b
    want_error: wrong_type

  # ========================= fstype (eager default=ext4) =========================
  - label: fstype-string-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      fstype: xfs
    want:
      FSType: xfs
  - label: fstype-default-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
    want:
      FSType: ext4
  - label: fstype-empty-defaults-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      fstype: ""
    want:
      FSType: ext4
  - label: fstype-numeric-coerced-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      fstype: 123
    want:
      FSType: "123"
  - label: fstype-numeric-coerced-msgpack
    universe: msgpack
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      fstype: 123
    want:
      FSType: "123"
  - label: fstype-composite-rejected-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      fstype:
        - a
        - b
    want_error: wrong_type

  # ======================== opts (eager default=defaults) ========================
  - label: opts-string-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      opts: defaults,noatime
    want:
      Options: defaults,noatime
  - label: opts-default-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
    want:
      Options: defaults
  - label: opts-empty-defaults-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      opts: ""
    want:
      Options: defaults
  - label: opts-numeric-coerced-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      opts: 123
    want:
      Options: "123"
  - label: opts-numeric-coerced-msgpack
    universe: msgpack
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      opts: 123
    want:
      Options: "123"
  - label: opts-composite-rejected-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      opts:
        - a
        - b
    want_error: wrong_type

  # ================================ dump (int) ================================
  - label: dump-int-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      dump: 1
    want:
      Dump: 1
  # BD-1: a msgpack dump arrives as a sized kind (int8) the legacy .(int) assertion
  # missed, leaving Dump=0; the uniform decoder honors it.
  - label: dump-int-msgpack
    universe: msgpack
    id: mp
    bd: BD-1
    input:
      device: /dev/sdb1
      dump: 1
    want:
      Dump: 1
  # BD-2: a CLI dump=1 (the string "1") is coerced base-10 (was dropped to 0).
  - label: dump-string-cli
    universe: cli
    id: mp
    bd: BD-2
    input:
      device: /dev/sdb1
      dump: 1
    want:
      Dump: 1
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted numeric-string dump is coerced too.
  - label: dump-numeric-string-yaml
    universe: yaml
    id: mp
    bd: BD-2
    input:
      device: /dev/sdb1
      dump: "1"
    want:
      Dump: 1
  # BD-6: a finite-integral FLOAT dump is coerced to the integer (`1.0` -> 1).
  - label: dump-float-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      dump: 1.0
    want:
      Dump: 1
  - label: dump-float-msgpack
    universe: msgpack
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      dump: 1.0
    want:
      Dump: 1
  - label: dump-composite-rejected-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      dump:
        - 1
        - 2
    want_error: wrong_type
  # PARITY: an absent dump stays 0; an empty-string dump falls through to 0 (no default).
  - label: dump-absent-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
    want:
      Dump: 0
  - label: dump-empty-string-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      dump: ""
    want:
      Dump: 0

  # ================================ pass (int) ================================
  # pass is the same plain-int type as dump, pinned per-param (not "same pattern").
  - label: pass-int-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      pass: 2
    want:
      Pass: 2
  - label: pass-int-msgpack
    universe: msgpack
    id: mp
    bd: BD-1
    input:
      device: /dev/sdb1
      pass: 2
    want:
      Pass: 2
  - label: pass-string-cli
    universe: cli
    id: mp
    bd: BD-2
    input:
      device: /dev/sdb1
      pass: 2
    want:
      Pass: 2
  - label: pass-numeric-string-yaml
    universe: yaml
    id: mp
    bd: BD-2
    input:
      device: /dev/sdb1
      pass: "2"
    want:
      Pass: 2
  - label: pass-float-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      pass: 2.0
    want:
      Pass: 2
  - label: pass-float-msgpack
    universe: msgpack
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      pass: 2.0
    want:
      Pass: 2
  - label: pass-composite-rejected-yaml
    universe: yaml
    id: mp
    bd: BD-6
    input:
      device: /dev/sdb1
      pass:
        - 1
        - 2
    want_error: wrong_type
  - label: pass-empty-string-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      pass: ""
    want:
      Pass: 0

  # ========================= persist (eager default=true) =========================
  - label: persist-true-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      persist: true
    want:
      Persist: true
  - label: persist-false-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      persist: false
    want:
      Persist: false
  # Parity: an absent persist eager-defaults to true.
  - label: persist-default-true-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
    want:
      Persist: true
  # Parity: an empty-string persist falls through to the eager default true.
  - label: persist-empty-defaults-true-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      persist: ""
    want:
      Persist: true
  # BD-2: a CLI persist=false (the string "false") is honored (was dropped to the
  # default true).
  - label: persist-falsy-string-cli
    universe: cli
    id: mp
    bd: BD-2
    input:
      device: /dev/sdb1
      persist: false
    want:
      Persist: false
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted "no" is honored too.
  - label: persist-falsy-string-yaml
    universe: yaml
    id: mp
    bd: BD-2
    input:
      device: /dev/sdb1
      persist: "no"
    want:
      Persist: false
  # BD-7: an integer persist is 1=true / 0=false across every int kind.
  - label: persist-int-one-yaml
    universe: yaml
    id: mp
    bd: BD-7
    input:
      device: /dev/sdb1
      persist: 1
    want:
      Persist: true
  - label: persist-int-one-msgpack
    universe: msgpack
    id: mp
    bd: BD-7
    input:
      device: /dev/sdb1
      persist: 1
    want:
      Persist: true
  - label: persist-int-zero-yaml
    universe: yaml
    id: mp
    bd: BD-7
    input:
      device: /dev/sdb1
      persist: 0
    want:
      Persist: false
  - label: persist-int-zero-msgpack
    universe: msgpack
    id: mp
    bd: BD-7
    input:
      device: /dev/sdb1
      persist: 0
    want:
      Persist: false
  - label: persist-invalid-int-yaml
    universe: yaml
    id: mp
    bd: BD-7
    input:
      device: /dev/sdb1
      persist: 2
    want_error: value_invalid
  - label: persist-invalid-int-msgpack
    universe: msgpack
    id: mp
    bd: BD-7
    input:
      device: /dev/sdb1
      persist: 2
    want_error: value_invalid

  # ============================== misc ==============================
  # A reserved requisite key does not break the decode (it is not a parameter).
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: mp
    input:
      device: /dev/sdb1
      require:
        - pkg.installed:nfs-common
    want:
      Device: /dev/sdb1
