module: host.absent
# Permanent differential contract for the host.absent migration. `name` is the
# primary (defaulting to the state ID) and the hosts-file path binds `config` with
# a `path` alias and an eager `default=/etc/hosts` (the per-field alias exemplar,
# same as host.present). There is no `ip`. All parameters are strings, so the only
# behavioral divergence is BD-6. These cases were approved by the legacy-vs-new
# equivalence comparison while the legacy constructor still existed (see the
# migration changelog); after its deletion RunContract replays them as the
# permanent regression guard.
#   BD-6 — a numeric name/config is coerced to its string form, a composite is
#          rejected;
#   §2.1 alias fall-through / empty-string (PARITY) — config wins over path, an
#          empty config falls through to path, an all-empty path eager-defaults to
#          /etc/hosts, an empty/nil name falls back to the state ID.
cases:
  # ============================ name (primary) ============================
  - label: string-name-yaml
    universe: yaml
    id: h
    input:
      name: web1
    want:
      Hostname: web1
  - label: string-name-msgpack
    universe: msgpack
    id: h
    input:
      name: web1
    want:
      Hostname: web1
  - label: string-name-cli
    universe: cli
    id: h
    input:
      name: web1
    want:
      Hostname: web1
  - label: primary-fallback-yaml
    universe: yaml
    id: web1
    input: {}
    want:
      Hostname: web1
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: web1
    input:
      name: ""
    want:
      Hostname: web1
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: web1
    input:
      name:
    want:
      Hostname: web1
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: h
    bd: BD-6
    input:
      name: 123
    want:
      Hostname: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: h
    bd: BD-6
    input:
      name: 123
    want:
      Hostname: "123"
  - label: composite-name-rejected-yaml
    universe: yaml
    id: h
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: h
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type

  # ===================== Path (config, path alias, default) =====================
  - label: config-sets-path-yaml
    universe: yaml
    id: web1
    input:
      config: /etc/hosts.d/custom
    want:
      Path: /etc/hosts.d/custom
  - label: path-alias-sets-path-yaml
    universe: yaml
    id: web1
    input:
      path: /tmp/hosts
    want:
      Path: /tmp/hosts
  - label: config-wins-over-path-yaml
    universe: yaml
    id: web1
    input:
      config: /etc/hosts.d/win
      path: /tmp/lose
    want:
      Path: /etc/hosts.d/win
  - label: empty-config-falls-through-to-path-yaml
    universe: yaml
    id: web1
    input:
      config: ""
      path: /tmp/hosts
    want:
      Path: /tmp/hosts
  - label: path-default-yaml
    universe: yaml
    id: web1
    input: {}
    want:
      Path: /etc/hosts
  - label: config-numeric-coerced-yaml
    universe: yaml
    id: web1
    bd: BD-6
    input:
      config: 123
    want:
      Path: "123"
  - label: config-numeric-coerced-msgpack
    universe: msgpack
    id: web1
    bd: BD-6
    input:
      config: 123
    want:
      Path: "123"
  - label: config-composite-rejected-yaml
    universe: yaml
    id: web1
    bd: BD-6
    input:
      config:
        - a
        - b
    want_error: wrong_type
  # BD-6 through the `path` ALIAS source (not just `config`): coercion/rejection is
  # origin-independent, so a numeric value delivered via the alias is coerced and a
  # composite via the alias is rejected exactly as through the canonical `config`.
  - label: path-alias-numeric-coerced-yaml
    universe: yaml
    id: web1
    bd: BD-6
    input:
      path: 123
    want:
      Path: "123"
  - label: path-alias-numeric-coerced-msgpack
    universe: msgpack
    id: web1
    bd: BD-6
    input:
      path: 123
    want:
      Path: "123"
  - label: path-alias-composite-rejected-yaml
    universe: yaml
    id: web1
    bd: BD-6
    input:
      path:
        - a
        - b
    want_error: wrong_type

  # ============================== misc ==============================
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: web1
    input:
      require:
        - file.managed:/etc/hosts
    want:
      Hostname: web1
