module: user.absent
# Permanent differential contract for the user.absent migration (an all-primitives
# surface: `name` primary, `purge`/`force` plain bools; nothing sensitive). These
# cases were approved by the legacy-vs-new equivalence comparison while the legacy
# constructor still existed (see the migration changelog); after its deletion
# RunContract replays them as the permanent regression guard. Accept cases pin the
# decoded exported-field projection; reject cases pin the error kind. BD-tagged
# cases pin the flagged behavioral differences, per the §11 per-PARAM pinning
# standard (every bool param gets its own int-one/int-zero/invalid-int arms across
# yaml+msgpack, plus its string-coercion arms):
#   BD-2 (APPROVED) — an ORIGIN-INDEPENDENT string coercion (a truthy/falsy string
#                     purge/force in EITHER the CLI or a YAML-quoted value) is
#                     honored (was silently dropped to the default false);
#   BD-6 (APPROVED) — a numeric `name` is coerced to its string form and a
#                     composite `name` is rejected, instead of silently falling
#                     back to the state ID;
#   BD-7 (APPROVED) — an integer purge/force is 1=true / 0=false, any other integer
#                     a typed error (was silently dropped);
#   §2.1/§3 empty/nil (PARITY, not a BD) — an empty/nil `name` falls back to the
#                     state ID; an empty-string purge/force falls through to the
#                     false zero value.
cases:
  # ============================ name (primary) ============================
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: olduser
    want:
      UserName: olduser
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: olduser
    want:
      UserName: olduser
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: olduser
    want:
      UserName: olduser
  # Parity: no name key -> primary falls back to the state ID.
  - label: primary-fallback-yaml
    universe: yaml
    id: olduser
    input: {}
    want:
      UserName: olduser
  # An EMPTY-STRING name falls back to the state ID (§2.1 primary idiom) — parity.
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: olduser
    input:
      name: ""
    want:
      UserName: olduser
  # A NIL name (YAML null / trailing-colon) is absent, falls back to the ID.
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: olduser
    input:
      name:
    want:
      UserName: olduser
  # BD-6: a numeric name is coerced to its string form (was fallback-to-id).
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      UserName: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      UserName: "123"
  # CLI already delivers "123" as a string, so this agrees with legacy.
  - label: numeric-name-cli
    universe: cli
    id: web
    input:
      name: 123
    want:
      UserName: "123"
  # BD-6: a composite name is rejected with a typed error (was fallback-to-id).
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type

  # =============================== purge (bool) ===============================
  # Parity: a native YAML bool decodes unchanged.
  - label: purge-true-yaml
    universe: yaml
    id: web
    input:
      name: olduser
      purge: true
    want:
      Purge: true
  - label: purge-false-yaml
    universe: yaml
    id: web
    input:
      name: olduser
      purge: false
    want:
      Purge: false
  # Parity: an absent purge stays false (the bool zero value).
  - label: purge-absent-false-yaml
    universe: yaml
    id: web
    input:
      name: olduser
    want:
      Purge: false
  # Parity: an empty-string purge falls through to the false zero value.
  - label: purge-empty-false-yaml
    universe: yaml
    id: web
    input:
      name: olduser
      purge: ""
    want:
      Purge: false
  # BD-2: a CLI purge=true (the string "true") is honored (was dropped to false).
  - label: purge-truthy-string-cli
    universe: cli
    id: web
    bd: BD-2
    input:
      name: olduser
      purge: true
    want:
      Purge: true
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted "yes" is honored too.
  - label: purge-truthy-string-yaml
    universe: yaml
    id: web
    bd: BD-2
    input:
      name: olduser
      purge: "yes"
    want:
      Purge: true
  # BD-7: an integer purge is 1=true / 0=false across every int kind.
  - label: purge-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: olduser
      purge: 1
    want:
      Purge: true
  - label: purge-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: olduser
      purge: 1
    want:
      Purge: true
  - label: purge-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: olduser
      purge: 0
    want:
      Purge: false
  - label: purge-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: olduser
      purge: 0
    want:
      Purge: false
  - label: purge-invalid-int-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: olduser
      purge: 2
    want_error: value_invalid
  - label: purge-invalid-int-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: olduser
      purge: 2
    want_error: value_invalid

  # =============================== force (bool) ===============================
  # force is the same plain-bool type as purge, pinned per-param (not "same pattern").
  - label: force-true-yaml
    universe: yaml
    id: web
    input:
      name: olduser
      force: true
    want:
      Force: true
  - label: force-false-yaml
    universe: yaml
    id: web
    input:
      name: olduser
      force: false
    want:
      Force: false
  - label: force-absent-false-yaml
    universe: yaml
    id: web
    input:
      name: olduser
    want:
      Force: false
  - label: force-empty-false-yaml
    universe: yaml
    id: web
    input:
      name: olduser
      force: ""
    want:
      Force: false
  # BD-2: a CLI force=true (the string "true") is honored (was dropped to false).
  - label: force-truthy-string-cli
    universe: cli
    id: web
    bd: BD-2
    input:
      name: olduser
      force: true
    want:
      Force: true
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted "on" is honored too.
  - label: force-truthy-string-yaml
    universe: yaml
    id: web
    bd: BD-2
    input:
      name: olduser
      force: "on"
    want:
      Force: true
  # BD-7: an integer force is 1=true / 0=false across every int kind.
  - label: force-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: olduser
      force: 1
    want:
      Force: true
  - label: force-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: olduser
      force: 1
    want:
      Force: true
  - label: force-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: olduser
      force: 0
    want:
      Force: false
  - label: force-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: olduser
      force: 0
    want:
      Force: false
  - label: force-invalid-int-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: olduser
      force: 2
    want_error: value_invalid
  - label: force-invalid-int-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: olduser
      force: 2
    want_error: value_invalid

  # ================================= misc =================================
  # A reserved requisite key does not break the decode (it is not a parameter).
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: web
    input:
      name: olduser
      require:
        - cmd.run:stop-service
    want:
      UserName: olduser
