module: file.absent
# Permanent differential contract for the file.absent migration. These cases
# were approved by the legacy-vs-new equivalence comparison while the legacy
# constructor still existed (see the migration changelog); after its deletion
# RunContract replays them as the permanent regression guard. Accepting cases
# pin the decoded Path projection; rejecting cases pin the error kind.
# BD-tagged cases pin the flagged behavioral difference (§11 BD-6): a
# non-string `name` is now coerced (scalar) or rejected (composite) instead of
# legacy's silent fallback to the state ID.
cases:
  # --- parity: explicit string name across all three universes ---
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: /tmp/gone.txt
    want:
      Path: /tmp/gone.txt
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: /tmp/gone.txt
    want:
      Path: /tmp/gone.txt
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: /tmp/gone.txt
    want:
      Path: /tmp/gone.txt

  # --- parity: no name key -> primary falls back to the state ID ---
  - label: primary-fallback-yaml
    universe: yaml
    id: /tmp/gone.txt
    input: {}
    want:
      Path: /tmp/gone.txt
  - label: primary-fallback-cli
    universe: cli
    id: /tmp/gone.txt
    input: {}
    want:
      Path: /tmp/gone.txt

  # --- parity: an EMPTY-STRING name falls back to the state ID (§2.1) ---
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: /tmp/gone.txt
    input:
      name: ""
    want:
      Path: /tmp/gone.txt
  - label: empty-name-falls-back-to-id-msgpack
    universe: msgpack
    id: /tmp/gone.txt
    input:
      name: ""
    want:
      Path: /tmp/gone.txt
  - label: empty-name-falls-back-to-id-cli
    universe: cli
    id: /tmp/gone.txt
    input:
      name: ""
    want:
      Path: /tmp/gone.txt

  # --- parity: a NIL name (YAML null / trailing-colon) is absent for the
  # param and falls back to the state ID (§2.1). Nil has no faithful CLI
  # spelling, so only the yaml/msgpack legs are pinned. ---
  - label: nil-name-falls-back-to-id-yaml
    universe: yaml
    id: /tmp/gone.txt
    input:
      name:
    want:
      Path: /tmp/gone.txt
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: /tmp/gone.txt
    input:
      name:
    want:
      Path: /tmp/gone.txt

  # --- parity: an ignored reserved/unknown key does not break the decode ---
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: web
    input:
      name: /tmp/gone.txt
      require:
        - cmd.run:stop-service
    want:
      Path: /tmp/gone.txt

  # --- BD-6: numeric name is coerced to its string form (was fallback-to-id) ---
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Path: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
    want:
      Path: "123"
  # CLI already delivers "123" as a string, so this agrees with legacy.
  - label: numeric-name-cli
    universe: cli
    id: web
    input:
      name: 123
    want:
      Path: "123"

  # --- BD-6: composite name is rejected with a typed error (was fallback-to-id) ---
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
    want_error: wrong_type
