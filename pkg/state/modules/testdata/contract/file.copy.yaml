module: file.copy
# Permanent differential contract for the file.copy migration. These cases
# were approved by the legacy-vs-new equivalence comparison while the legacy
# constructor still existed (see the migration changelog); after its deletion
# RunContract replays them as the permanent regression guard. Accepting cases
# pin the decoded Path/Source/Force/Preserve/MakeDirs projection; rejecting
# cases pin the error kind. `source` is REQUIRED: a missing or empty source
# fails BOTH legacy (its explicit `if f.Source == "" { return err }` check)
# and the decoded MissingRequired error — "both reject" is PARITY under the
# harness regardless of error shape, not a BD. BD-tagged cases pin the
# flagged behavioral differences: BD-2 (a CLI bool string is honored), BD-6
# (a wrong-typed value is coerced or rejected instead of silently
# ignored/falling back), and BD-7 (every boolean's integer arm —
# force/preserve/makedirs each accept 1/0 and reject any other integer with a
# typed error). The name-empty-path-wins pair is PARITY (§2.1 source
# fall-through), not a BD.
cases:
  # --- parity: explicit string name across all three universes ---
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: /etc/dst
      source: /etc/src
    want:
      Path: /etc/dst
      Source: /etc/src
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: /etc/dst
      source: /etc/src
    want:
      Path: /etc/dst
      Source: /etc/src
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: /etc/dst
      source: /etc/src
    want:
      Path: /etc/dst
      Source: /etc/src

  # --- parity: the `path` alias supplies the primary when `name` is absent ---
  - label: path-alias-yaml
    universe: yaml
    id: web
    input:
      path: /etc/dst
      source: /etc/src
    want:
      Path: /etc/dst
  - label: path-alias-cli
    universe: cli
    id: web
    input:
      path: /etc/dst
      source: /etc/src
    want:
      Path: /etc/dst

  # --- parity: no name/path key -> primary falls back to the state ID ---
  - label: primary-fallback-yaml
    universe: yaml
    id: /etc/dst
    input:
      source: /etc/src
    want:
      Path: /etc/dst
  - label: primary-fallback-cli
    universe: cli
    id: /etc/dst
    input:
      source: /etc/src
    want:
      Path: /etc/dst

  # --- parity: an EMPTY-STRING name falls back to the state ID (§2.1) ---
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: /etc/dst
    input:
      name: ""
      source: /etc/src
    want:
      Path: /etc/dst
  - label: empty-name-falls-back-to-id-cli
    universe: cli
    id: /etc/dst
    input:
      name: ""
      source: /etc/src
    want:
      Path: /etc/dst

  # --- PARITY (§2.1 source fall-through, NOT a BD): an empty-string `name`
  # alongside a non-empty `path` alias resolves to the PATH, not the state ID. ---
  - label: name-empty-path-wins-yaml
    universe: yaml
    id: /the/id
    input:
      name: ""
      path: /etc/dst
      source: /etc/src
    want:
      Path: /etc/dst
  - label: name-empty-path-wins-msgpack
    universe: msgpack
    id: /the/id
    input:
      name: ""
      path: /etc/dst
      source: /etc/src
    want:
      Path: /etc/dst

  # --- parity: a NIL name (YAML null / trailing-colon) is absent, falls back
  # to the state ID (§2.1). Nil has no faithful CLI spelling. ---
  - label: nil-name-falls-back-to-id-yaml
    universe: yaml
    id: /etc/dst
    input:
      name:
      source: /etc/src
    want:
      Path: /etc/dst
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: /etc/dst
    input:
      name:
      source: /etc/src
    want:
      Path: /etc/dst

  # --- parity: source is required — a missing source fails both legacy
  # (explicit check) and decoded (typed MissingRequired) ---
  - label: source-missing-rejected-yaml
    universe: yaml
    id: web
    input:
      name: /etc/dst
    want_error: missing_required
  - label: source-missing-rejected-cli
    universe: cli
    id: web
    input:
      name: /etc/dst
    want_error: missing_required
  # --- parity: an EMPTY-STRING source is treated as absent (§2.1/§3) and
  # fails the same required check ---
  - label: source-empty-rejected-yaml
    universe: yaml
    id: web
    input:
      name: /etc/dst
      source: ""
    want_error: missing_required

  # --- parity: force/preserve/makedirs as native bools ---
  - label: force-true-yaml
    universe: yaml
    id: web
    input:
      name: /etc/dst
      source: /etc/src
      force: true
    want:
      Force: true
  - label: preserve-true-yaml
    universe: yaml
    id: web
    input:
      name: /etc/dst
      source: /etc/src
      preserve: true
    want:
      Preserve: true
  - label: makedirs-true-yaml
    universe: yaml
    id: web
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: true
    want:
      MakeDirs: true

  # --- BD-2: a CLI bool string (force/preserve/makedirs) is now honored,
  # where legacy's .(bool) assertion dropped it ---
  - label: force-cli-truthy-string
    universe: cli
    id: web
    bd: BD-2
    input:
      name: /etc/dst
      source: /etc/src
      force: true
    want:
      Force: true
  - label: preserve-cli-truthy-string
    universe: cli
    id: web
    bd: BD-2
    input:
      name: /etc/dst
      source: /etc/src
      preserve: true
    want:
      Preserve: true
  - label: makedirs-cli-truthy-string
    universe: cli
    id: web
    bd: BD-2
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: true
    want:
      MakeDirs: true

  # --- BD-7: makedirs accepts the INTEGERS 1 and 0 (1 -> true, 0 -> false)
  # and rejects any other integer with a typed error. Every boolean parameter
  # of this module (force, preserve, makedirs) is pinned explicitly across yaml
  # (native int) and msgpack (sized int) — not a representative. ---
  - label: makedirs-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: 1
    want:
      MakeDirs: true
  - label: makedirs-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: 1
    want:
      MakeDirs: true
  - label: makedirs-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: 0
    want:
      MakeDirs: false
  - label: makedirs-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: 0
    want:
      MakeDirs: false
  - label: makedirs-int-invalid-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: 2
    want_error: value_invalid
  - label: makedirs-int-invalid-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      makedirs: 2
    want_error: value_invalid

  # --- BD-7: force's integer arm, pinned explicitly across yaml + msgpack ---
  - label: force-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      force: 1
    want:
      Force: true
  - label: force-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      force: 1
    want:
      Force: true
  - label: force-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      force: 0
    want:
      Force: false
  - label: force-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      force: 0
    want:
      Force: false
  - label: force-int-invalid-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      force: 2
    want_error: value_invalid
  - label: force-int-invalid-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      force: 2
    want_error: value_invalid

  # --- BD-7: preserve's integer arm, pinned explicitly across yaml + msgpack ---
  - label: preserve-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      preserve: 1
    want:
      Preserve: true
  - label: preserve-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      preserve: 1
    want:
      Preserve: true
  - label: preserve-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      preserve: 0
    want:
      Preserve: false
  - label: preserve-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      preserve: 0
    want:
      Preserve: false
  - label: preserve-int-invalid-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      preserve: 2
    want_error: value_invalid
  - label: preserve-int-invalid-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/dst
      source: /etc/src
      preserve: 2
    want_error: value_invalid

  # --- parity: a full realistic config ---
  - label: full-config-yaml
    universe: yaml
    id: web
    input:
      path: /etc/dst
      source: /etc/src
      force: true
      preserve: true
      makedirs: true
    want:
      Path: /etc/dst
      Source: /etc/src
      Force: true
      Preserve: true
      MakeDirs: true

  # --- BD-6: numeric name is coerced to its string form (was fallback-to-id) ---
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
      source: /etc/src
    want:
      Path: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
      source: /etc/src
    want:
      Path: "123"
  # CLI already delivers "123" as a string, so this agrees with legacy.
  - label: numeric-name-cli
    universe: cli
    id: web
    input:
      name: 123
      source: /etc/src
    want:
      Path: "123"

  # --- BD-6: composite name is rejected with a typed error (was fallback-to-id) ---
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
      source: /etc/src
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
      source: /etc/src
    want_error: wrong_type

  # --- parity: a composite source fails BOTH legacy (falls to "" then hits
  # the required check) and decoded (typed wrong-type error) ---
  - label: composite-source-rejected-yaml
    universe: yaml
    id: web
    input:
      name: /etc/dst
      source:
        - a
        - b
    want_error: wrong_type

  # --- BD-6: a numeric `source` (the REQUIRED non-primary string) sprints to
  # its string form — a reject-to-accept flip, since legacy's `.(string)`
  # assertion zeroed it and then hit the "source is required" check. Pinned
  # across yaml (native int) and msgpack (sized int). (A MISSING source stays
  # PARITY — both reject — pinned by source-missing-rejected above.) ---
  - label: numeric-source-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: /etc/dst
      source: 5
    want:
      Source: "5"
  - label: numeric-source-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: /etc/dst
      source: 5
    want:
      Source: "5"
