module: git.cloned
# Permanent differential contract for the git.cloned migration. `name` is the
# primary and means the CLONE PATH (the opposite of git.latest, whose primary
# is the remote URL); `url` is `required`; `branch`/`rev` are plain strings;
# `depth` is a plain int; `force` is a primitive bool. These cases were
# approved by the legacy-vs-new equivalence comparison while the legacy
# constructor still existed (see the migration changelog); after its deletion
# RunContract replays them as the permanent regression guard. Accept cases pin
# the decoded exported-field projection; reject cases pin the error kind.
#   BD-1 — a msgpack sized-int depth is honored (was dropped to 0);
#   BD-2 — an ORIGIN-INDEPENDENT truthy/falsy-string force is honored (was
#          silently dropped); a numeric-string depth (the CLI's ONLY delivery
#          form for an int, and a YAML-quoted equivalent) is coerced base-10
#          (was silently dropped to 0 by the legacy config["depth"].(int)
#          assertion, which never matches a string);
#   BD-6 — a wrong-typed name/url/branch/rev is coerced (scalar) or rejected
#          (composite); the numeric url accept is an ERROR->ACCEPT flip on the
#          REQUIRED param; a finite-integral FLOAT depth is coerced;
#   BD-7 — an integer force is 1=true / 0=false, any other integer a typed
#          error;
#   §2.1/§3 empty-string (PARITY, not a BD) — an empty-string name falls back
#          to the state ID.
cases:
  # ============================ name (primary = PATH) ============================
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: /opt/app
      url: https://github.com/example/repo
    want:
      Path: /opt/app
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: /opt/app
      url: https://github.com/example/repo
    want:
      Path: /opt/app
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: /opt/app
      url: https://github.com/example/repo
    want:
      Path: /opt/app
  - label: primary-fallback-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
    want:
      Path: /opt/app
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: /opt/app
    input:
      name: ""
      url: https://github.com/example/repo
    want:
      Path: /opt/app
  # BD-6: a numeric name is coerced to its string form (was fallback-to-id).
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
      url: https://github.com/example/repo
    want:
      Path: "123"
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
      url: https://github.com/example/repo
    want_error: wrong_type

  # ============================ url (required) ============================
  - label: url-string-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
    want:
      URL: https://github.com/example/repo
  - label: url-missing-rejected-yaml
    universe: yaml
    id: /opt/app
    input: {}
    want_error: missing_required
  - label: url-empty-rejected-yaml
    universe: yaml
    id: /opt/app
    input:
      url: ""
    want_error: missing_required
  - label: url-missing-rejected-msgpack
    universe: msgpack
    id: /opt/app
    input: {}
    want_error: missing_required
  # BD-6 (ERROR->ACCEPT flip on a REQUIRED param): a numeric url is coerced to
  # its string form and ACCEPTED, where legacy config["url"].(string) missed
  # the non-string and hard-errored 'url is required'.
  - label: url-numeric-accepted-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url: 123
    want:
      URL: "123"
  - label: url-numeric-accepted-msgpack
    universe: msgpack
    id: /opt/app
    bd: BD-6
    input:
      url: 123
    want:
      URL: "123"
  - label: url-composite-rejected-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url:
        - a
        - b
    want_error: wrong_type

  # ============================== branch / rev ==============================
  - label: branch-string-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
      branch: main
    want:
      Branch: main
  - label: rev-string-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
      rev: a1b2c3d
    want:
      Rev: a1b2c3d
  - label: branch-numeric-coerced-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      branch: 5
    want:
      Branch: "5"
  - label: branch-numeric-coerced-msgpack
    universe: msgpack
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      branch: 5
    want:
      Branch: "5"
  - label: branch-composite-rejected-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      branch:
        - a
        - b
    want_error: wrong_type
  - label: rev-numeric-coerced-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      rev: 7
    want:
      Rev: "7"
  - label: rev-numeric-coerced-msgpack
    universe: msgpack
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      rev: 7
    want:
      Rev: "7"
  - label: rev-composite-rejected-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      rev:
        - a
        - b
    want_error: wrong_type

  # ================================ depth (int) ================================
  - label: depth-native-int-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
      depth: 1
    want:
      Depth: 1
  # BD-1: depth over msgpack (a sized int8) is honored, where legacy
  # config["depth"].(int) dropped every non-int kind to 0.
  - label: depth-msgpack-sized-int
    universe: msgpack
    id: /opt/app
    bd: BD-1
    input:
      url: https://github.com/example/repo
      depth: 1
    want:
      Depth: 1
  # BD-2: a CLI depth=1 (the string "1" — the CLI's ONLY delivery form for an
  # int) is coerced base-10, where the legacy config["depth"].(int) assertion
  # never matched a string and silently dropped it to 0 (full clone instead of
  # the requested shallow depth).
  - label: depth-numeric-string-cli
    universe: cli
    id: /opt/app
    bd: BD-2
    input:
      url: https://github.com/example/repo
      depth: 1
    want:
      Depth: 1
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted numeric-string depth is coerced
  # too.
  - label: depth-numeric-string-yaml
    universe: yaml
    id: /opt/app
    bd: BD-2
    input:
      url: https://github.com/example/repo
      depth: "1"
    want:
      Depth: 1
  - label: depth-absent-defaults-zero-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
    want:
      Depth: 0
  # BD-6: a finite-integral float depth is coerced (1.0 -> 1), where legacy
  # `.(int)` assertion missed a float64 and left Depth=0.
  - label: depth-float-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      depth: 1.0
    want:
      Depth: 1
  - label: depth-float-msgpack
    universe: msgpack
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      depth: 1.0
    want:
      Depth: 1
  - label: depth-composite-rejected-yaml
    universe: yaml
    id: /opt/app
    bd: BD-6
    input:
      url: https://github.com/example/repo
      depth:
        - 1
        - 2
    want_error: wrong_type

  # ============================== force (bool) ==============================
  - label: force-true-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
      force: true
    want:
      Force: true
  - label: force-true-msgpack
    universe: msgpack
    id: /opt/app
    input:
      url: https://github.com/example/repo
      force: true
    want:
      Force: true
  - label: force-absent-defaults-false-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
    want:
      Force: false
  # BD-2: a CLI force=true (the string "true") is honored (was dropped to false).
  - label: force-truthy-string-cli
    universe: cli
    id: /opt/app
    bd: BD-2
    input:
      url: https://github.com/example/repo
      force: true
    want:
      Force: true
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted "yes" is honored too.
  - label: force-truthy-string-yaml
    universe: yaml
    id: /opt/app
    bd: BD-2
    input:
      url: https://github.com/example/repo
      force: "yes"
    want:
      Force: true
  # BD-2: a falsy string (CLI and YAML-quoted) is honored.
  - label: force-falsy-string-cli
    universe: cli
    id: /opt/app
    bd: BD-2
    input:
      url: https://github.com/example/repo
      force: false
    want:
      Force: false
  - label: force-falsy-string-yaml
    universe: yaml
    id: /opt/app
    bd: BD-2
    input:
      url: https://github.com/example/repo
      force: "no"
    want:
      Force: false
  # BD-7: an integer force is 1=true / 0=false across every int kind.
  - label: force-int-one-yaml
    universe: yaml
    id: /opt/app
    bd: BD-7
    input:
      url: https://github.com/example/repo
      force: 1
    want:
      Force: true
  - label: force-int-one-msgpack
    universe: msgpack
    id: /opt/app
    bd: BD-7
    input:
      url: https://github.com/example/repo
      force: 1
    want:
      Force: true
  - label: force-int-zero-yaml
    universe: yaml
    id: /opt/app
    bd: BD-7
    input:
      url: https://github.com/example/repo
      force: 0
    want:
      Force: false
  - label: force-int-zero-msgpack
    universe: msgpack
    id: /opt/app
    bd: BD-7
    input:
      url: https://github.com/example/repo
      force: 0
    want:
      Force: false
  # BD-7 (rejection arm): any integer other than 0/1 is a typed value error.
  - label: force-invalid-int-yaml
    universe: yaml
    id: /opt/app
    bd: BD-7
    input:
      url: https://github.com/example/repo
      force: 2
    want_error: value_invalid
  - label: force-invalid-int-msgpack
    universe: msgpack
    id: /opt/app
    bd: BD-7
    input:
      url: https://github.com/example/repo
      force: 2
    want_error: value_invalid

  # ============================== misc ==============================
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: /opt/app
    input:
      url: https://github.com/example/repo
      require:
        - pkg.installed:git
    want:
      Path: /opt/app
      URL: https://github.com/example/repo
