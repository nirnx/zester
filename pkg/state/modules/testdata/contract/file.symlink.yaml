module: file.symlink
# Permanent differential contract for the file.symlink migration. These cases
# were approved by the legacy-vs-new equivalence comparison while the legacy
# constructor still existed (see the migration changelog); after its deletion
# RunContract replays them as the permanent regression guard. Accepting cases
# pin the decoded Path/Target/Force/MakeDirs projection; rejecting cases pin
# the error kind. BD-tagged cases pin the flagged behavioral differences:
# BD-2 (a CLI bool string is honored), BD-6 (a wrong-typed value is coerced
# or rejected instead of silently ignored/left empty/falling back), and BD-7
# (every boolean's integer arm — force/makedirs each accept 1/0 and reject any
# other integer with a typed error).
# Unlike file.managed/file.touch/file.copy, `name` has NO `path` alias here
# (the legacy constructor never accepted one).
cases:
  # --- parity: explicit string name across all three universes ---
  - label: string-name-yaml
    universe: yaml
    id: web
    input:
      name: /etc/link
      target: /etc/target
    want:
      Path: /etc/link
      Target: /etc/target
  - label: string-name-msgpack
    universe: msgpack
    id: web
    input:
      name: /etc/link
      target: /etc/target
    want:
      Path: /etc/link
      Target: /etc/target
  - label: string-name-cli
    universe: cli
    id: web
    input:
      name: /etc/link
      target: /etc/target
    want:
      Path: /etc/link
      Target: /etc/target

  # --- parity: no name key -> primary falls back to the state ID ---
  - label: primary-fallback-yaml
    universe: yaml
    id: /etc/link
    input:
      target: /etc/target
    want:
      Path: /etc/link
  - label: primary-fallback-cli
    universe: cli
    id: /etc/link
    input:
      target: /etc/target
    want:
      Path: /etc/link

  # --- parity: an EMPTY-STRING name falls back to the state ID (§2.1) ---
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: /etc/link
    input:
      name: ""
      target: /etc/target
    want:
      Path: /etc/link
  - label: empty-name-falls-back-to-id-cli
    universe: cli
    id: /etc/link
    input:
      name: ""
      target: /etc/target
    want:
      Path: /etc/link

  # --- parity: a NIL name (YAML null / trailing-colon) is absent, falls back
  # to the state ID (§2.1). Nil has no faithful CLI spelling. ---
  - label: nil-name-falls-back-to-id-yaml
    universe: yaml
    id: /etc/link
    input:
      name:
      target: /etc/target
    want:
      Path: /etc/link
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: /etc/link
    input:
      name:
      target: /etc/target
    want:
      Path: /etc/link

  # --- parity: target is a plain string, not required (an empty target is
  # accepted at decode time, exactly as legacy left it "") ---
  - label: target-empty-yaml
    universe: yaml
    id: /etc/link
    input: {}
    want:
      Target: ""

  # --- parity: force/makedirs as native bools ---
  - label: force-true-yaml
    universe: yaml
    id: web
    input:
      name: /etc/link
      target: /etc/target
      force: true
    want:
      Force: true
  - label: makedirs-true-yaml
    universe: yaml
    id: web
    input:
      name: /etc/link
      target: /etc/target
      makedirs: true
    want:
      MakeDirs: true

  # --- BD-2: a CLI bool string (force/makedirs) is now honored, where legacy's
  # .(bool) assertion dropped it ---
  - label: force-cli-truthy-string
    universe: cli
    id: web
    bd: BD-2
    input:
      name: /etc/link
      target: /etc/target
      force: true
    want:
      Force: true
  - label: makedirs-cli-truthy-string
    universe: cli
    id: web
    bd: BD-2
    input:
      name: /etc/link
      target: /etc/target
      makedirs: true
    want:
      MakeDirs: true

  # --- BD-7: makedirs accepts the INTEGERS 1 and 0 (1 -> true, 0 -> false)
  # and rejects any other integer with a typed error. Every boolean parameter
  # of this module (force, makedirs) is pinned explicitly across yaml (native
  # int) and msgpack (sized int) — not a representative. ---
  - label: makedirs-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      makedirs: 1
    want:
      MakeDirs: true
  - label: makedirs-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      makedirs: 1
    want:
      MakeDirs: true
  - label: makedirs-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      makedirs: 0
    want:
      MakeDirs: false
  - label: makedirs-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      makedirs: 0
    want:
      MakeDirs: false
  - label: makedirs-int-invalid-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      makedirs: 2
    want_error: value_invalid
  - label: makedirs-int-invalid-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      makedirs: 2
    want_error: value_invalid

  # --- BD-7: force's integer arm, pinned explicitly across yaml + msgpack ---
  - label: force-int-one-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      force: 1
    want:
      Force: true
  - label: force-int-one-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      force: 1
    want:
      Force: true
  - label: force-int-zero-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      force: 0
    want:
      Force: false
  - label: force-int-zero-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      force: 0
    want:
      Force: false
  - label: force-int-invalid-yaml
    universe: yaml
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      force: 2
    want_error: value_invalid
  - label: force-int-invalid-msgpack
    universe: msgpack
    id: web
    bd: BD-7
    input:
      name: /etc/link
      target: /etc/target
      force: 2
    want_error: value_invalid

  # --- parity: a full realistic config ---
  - label: full-config-yaml
    universe: yaml
    id: web
    input:
      name: /etc/link
      target: /etc/target
      force: true
      makedirs: true
    want:
      Path: /etc/link
      Target: /etc/target
      Force: true
      MakeDirs: true

  # --- BD-6: numeric name is coerced to its string form (was fallback-to-id) ---
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: 123
      target: /etc/target
    want:
      Path: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: 123
      target: /etc/target
    want:
      Path: "123"
  # CLI already delivers "123" as a string, so this agrees with legacy.
  - label: numeric-name-cli
    universe: cli
    id: web
    input:
      name: 123
      target: /etc/target
    want:
      Path: "123"

  # --- BD-6: composite name is rejected with a typed error (was fallback-to-id) ---
  - label: composite-name-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
      target: /etc/target
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name:
        - a
        - b
      target: /etc/target
    want_error: wrong_type

  # --- BD-6: numeric target is coerced to its string form (was silently
  # left empty by the legacy .(string) assertion). Pinned across yaml (native
  # int) and msgpack (sized int). ---
  - label: numeric-target-coerced-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: /etc/link
      target: 5
    want:
      Target: "5"
  - label: numeric-target-coerced-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: /etc/link
      target: 5
    want:
      Target: "5"

  # --- BD-6: a composite target is rejected with a typed error (legacy's
  # .(string) assertion silently left Target empty) ---
  - label: composite-target-rejected-yaml
    universe: yaml
    id: web
    bd: BD-6
    input:
      name: /etc/link
      target:
        - a
        - b
    want_error: wrong_type
  - label: composite-target-rejected-msgpack
    universe: msgpack
    id: web
    bd: BD-6
    input:
      name: /etc/link
      target:
        - a
        - b
    want_error: wrong_type
