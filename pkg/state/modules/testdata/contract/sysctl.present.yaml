module: sysctl.present
# Permanent differential contract for the sysctl.present migration. `name` is the
# primary (defaulting to the state ID), `value` is `required`, and `persist` is an
# eager `default=true` bool. The require-file-provider-when-persist rule is
# builder-tail module logic (not schema), so it is exercised by the unit tests, not
# this decoder contract. These cases were approved by the legacy-vs-new equivalence
# comparison while the legacy constructor still existed (see the migration
# changelog); after its deletion RunContract replays them as the permanent
# regression guard. Accept cases pin the decoded exported-field projection; reject
# cases pin the error kind. BD-tagged cases pin the flagged behavioral differences,
# per the §11 per-PARAM pinning standard:
#   BD-2 — an ORIGIN-INDEPENDENT truthy/falsy-string persist (in EITHER the CLI or a
#          YAML-quoted value) is honored (was silently dropped);
#   BD-6 — a wrong-typed value is coerced (a numeric name/value to its string form)
#          or rejected (a composite name/value) instead of silently falling back /
#          hard-erroring; the numeric `value` accept is an ERROR->ACCEPT flip on the
#          REQUIRED param;
#   BD-7 — an integer persist is 1=true / 0=false, any other integer a typed error
#          (was silently dropped);
#   §2.1/§3 empty-string (PARITY, not a BD) — an empty-string name falls back to the
#          state ID; an empty-string value is missing_required; an empty persist
#          eager-defaults to true.
cases:
  # ============================ name (primary) ============================
  - label: string-name-yaml
    universe: yaml
    id: sk
    input:
      name: net.ipv4.ip_forward
      value: "1"
    want:
      Key: net.ipv4.ip_forward
      Value: "1"
  - label: string-name-msgpack
    universe: msgpack
    id: sk
    input:
      name: net.ipv4.ip_forward
      value: "1"
    want:
      Key: net.ipv4.ip_forward
  - label: string-name-cli
    universe: cli
    id: sk
    input:
      name: net.ipv4.ip_forward
      value: "1"
    want:
      Key: net.ipv4.ip_forward
  - label: primary-fallback-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: "1"
    want:
      Key: net.ipv4.ip_forward
  - label: empty-name-falls-back-to-id-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      name: ""
      value: "1"
    want:
      Key: net.ipv4.ip_forward
  - label: nil-name-falls-back-to-id-msgpack
    universe: msgpack
    id: net.ipv4.ip_forward
    input:
      name:
      value: "1"
    want:
      Key: net.ipv4.ip_forward
  - label: numeric-name-coerced-yaml
    universe: yaml
    id: sk
    bd: BD-6
    input:
      name: 123
      value: "1"
    want:
      Key: "123"
  - label: numeric-name-coerced-msgpack
    universe: msgpack
    id: sk
    bd: BD-6
    input:
      name: 123
      value: "1"
    want:
      Key: "123"
  - label: composite-name-rejected-yaml
    universe: yaml
    id: sk
    bd: BD-6
    input:
      name:
        - a
        - b
      value: "1"
    want_error: wrong_type
  - label: composite-name-rejected-msgpack
    universe: msgpack
    id: sk
    bd: BD-6
    input:
      name:
        - a
        - b
      value: "1"
    want_error: wrong_type

  # ============================ value (required) ============================
  - label: value-string-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: "1"
    want:
      Value: "1"
  - label: value-missing-rejected-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input: {}
    want_error: missing_required
  - label: value-empty-rejected-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: ""
    want_error: missing_required
  - label: value-missing-rejected-msgpack
    universe: msgpack
    id: net.ipv4.ip_forward
    input: {}
    want_error: missing_required
  # BD-6 (ERROR->ACCEPT flip on a REQUIRED param): a numeric value is coerced to its
  # string form and ACCEPTED, where legacy config["value"].(string) missed the
  # non-string and hard-errored 'value is required'.
  - label: value-numeric-accepted-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    bd: BD-6
    input:
      value: 1
    want:
      Value: "1"
  - label: value-numeric-accepted-msgpack
    universe: msgpack
    id: net.ipv4.ip_forward
    bd: BD-6
    input:
      value: 1
    want:
      Value: "1"
  - label: value-composite-rejected-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    bd: BD-6
    input:
      value:
        - a
        - b
    want_error: wrong_type

  # ========================= persist (eager default=true) =========================
  - label: persist-true-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: "1"
      persist: true
    want:
      Persist: true
  - label: persist-false-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: "1"
      persist: false
    want:
      Persist: false
  - label: persist-default-true-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: "1"
    want:
      Persist: true
  - label: persist-empty-defaults-true-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: "1"
      persist: ""
    want:
      Persist: true
  # BD-2: a CLI persist=false (the string "false") is honored (was dropped to the
  # default true).
  - label: persist-falsy-string-cli
    universe: cli
    id: net.ipv4.ip_forward
    bd: BD-2
    input:
      value: "1"
      persist: false
    want:
      Persist: false
  # BD-2 is ORIGIN-INDEPENDENT: a YAML-quoted "no" is honored too.
  - label: persist-falsy-string-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    bd: BD-2
    input:
      value: "1"
      persist: "no"
    want:
      Persist: false
  # BD-7: an integer persist is 1=true / 0=false across every int kind.
  - label: persist-int-one-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    bd: BD-7
    input:
      value: "1"
      persist: 1
    want:
      Persist: true
  - label: persist-int-one-msgpack
    universe: msgpack
    id: net.ipv4.ip_forward
    bd: BD-7
    input:
      value: "1"
      persist: 1
    want:
      Persist: true
  - label: persist-int-zero-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    bd: BD-7
    input:
      value: "1"
      persist: 0
    want:
      Persist: false
  - label: persist-int-zero-msgpack
    universe: msgpack
    id: net.ipv4.ip_forward
    bd: BD-7
    input:
      value: "1"
      persist: 0
    want:
      Persist: false
  - label: persist-invalid-int-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    bd: BD-7
    input:
      value: "1"
      persist: 2
    want_error: value_invalid
  - label: persist-invalid-int-msgpack
    universe: msgpack
    id: net.ipv4.ip_forward
    bd: BD-7
    input:
      value: "1"
      persist: 2
    want_error: value_invalid

  # ============================== misc ==============================
  - label: reserved-key-ignored-yaml
    universe: yaml
    id: net.ipv4.ip_forward
    input:
      value: "1"
      require:
        - pkg.installed:procps
    want:
      Value: "1"
