# NATS cluster node 1 — layers cluster config on top of playground-init base.
# include resolves relative to this file's directory (/data/nats-cluster/).
include ../nats/nats-server.conf

server_name: nats-1
http_port: 8222
client_advertise: nats:4222

cluster {
  name: zester-cluster
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats:6222
    nats-route://nats-2:6222
    nats-route://nats-3:6222
  ]
}
