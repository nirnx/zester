name: zester-peel
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
maintainer: "Zester Maintainers"
description: "Zester peel agent"
license: "Proprietary"
depends:
  - zester-watchdog (>= ${VERSION})
contents:
  - src: bin/release/zester-peel
    dst: /usr/local/bin/zester-peel
    file_info:
      mode: 0755
  - src: packaging/systemd/zester-peel.service
    dst: /lib/systemd/system/zester-peel.service
  - src: packaging/config/peel.yaml
    dst: /etc/zester/peel.yaml
    type: config|noreplace
scripts:
  postinstall: packaging/scripts/postinstall-peel.sh
  preremove: packaging/scripts/preremove-peel.sh
