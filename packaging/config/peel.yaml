# Zester Peel Agent Configuration
#
# Zero-config target: with an embedded-CA master and discovery enabled, a
# peel needs only master_urls (+ an optional enroll_ca_pin). Everything else —
# the NATS endpoint list and CA trust bundle — is discovered at enrollment and
# cached locally. Uncomment master_urls and set it to your master(s):
#
# master_urls:
#   - "https://master-1.example.com:8443"
# enroll_ca_pin:                   # from 'zester ca fingerprint' — verified
#   - "sha256:<hex>"               # first contact (omit for TOFU on first use)

id: ""    # set to a sanitized hostname by postinstall

# --- Enrollment trust (optional) --------------------------------------------
# enroll_trust: tofu   # tofu (default): trust the CA on first contact and
#                      # persist it (Salt-style; the fingerprint is bound into
#                      # the enrollment and shown at 'zester enroll approve').
#                      # strict: refuse first contact without enroll_ca_pin /
#                      # enroll_ca (fail closed).
# enroll_ca: "/etc/zester/enroll-ca.crt"   # explicit CA file (strict)

# --- Explicit overrides (optional; win over discovery) ----------------------
# Set nats_url ONLY to bypass discovery (e.g. an all-in-one box where the
# master may not advertise loopback). Leave unset for the zero-config path.
# nats_url: "tls://nats.example.com:4222"
# nats_ca:  "/var/lib/zester/auth/nats-ca.crt"

# --- Filesystem layout (package defaults; rarely changed) -------------------
# Credentials/trust material and runtime state. Keep auth_dir in sync with the
# --nats-creds path in zester-peel.service — the watchdog reads the peel's
# <id>.creds from here.
auth_dir: "/var/lib/zester/auth"
data_dir: "/var/lib/zester"
states_cache: "/var/cache/zester/states"

# Local /healthz, /readyz and /metrics (default 127.0.0.1:9090).
# health_addr: "127.0.0.1:9090"

# Log level: debug, info, warn or error (default info).
# log_level: "info"
# Log format: json or text (default json).
# log_format: "json"

# Local scheduler (optional). Entries run modules at intervals or cron times;
# return_job publishes results as synthetic jobs visible in "zester job list".
# schedule:
#   refresh-facts:
#     module: "facts.items"
#     interval: "10m"
#     splay: "1m"
#     return_job: true
